<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Leon Muyesu — Full‑Stack Developer</title>
    <meta name="description" content="Portfolio of a full‑stack developer specializing in Python, Django, JavaScript, and Node.js." />
    <meta name="theme-color" content="#0b0f14" />
    <meta property="og:title" content="Leon Muyesu — Full‑Stack Developer" />
    <meta property="og:description" content="Fast, accessible web apps with Python/Django and JavaScript/Node.js." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leonmuyesuportfolio.netlify.app/" />

    <!-- Apply the saved theme before first paint so light-mode visitors don't see a dark flash -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <!-- Non-blocking font load: only the weights the site actually uses -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
